<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>후보자 프로필 보고서 생성기</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e2e5ea; --ink: #1c2330;
    --muted: #6b7280; --accent: #1d4ed8; --accent-weak: #eef2ff; --ok: #157347; --danger: #b02a37;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 14px; line-height: 1.5; }
  header { background: #0f172a; color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 4px 0 0; color: #cbd5e1; font-size: 12.5px; }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 100px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 14.5px; }
  label { display: block; font-weight: 600; margin: 12px 0 5px; font-size: 12.5px; }
  input[type=text], input[type=url], textarea, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; color: var(--ink); }
  textarea { resize: vertical; }
  .fmt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .fmt label { display: block; margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; font-weight: 600; position: relative; }
  .fmt label.sel { border-color: var(--accent); background: var(--accent-weak); }
  .fmt small { display: block; color: var(--muted); font-weight: 400; margin-top: 3px; font-size: 11.5px; }
  .fmt input { position: absolute; opacity: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 150px; }
  button { border: 0; border-radius: 8px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .primary:disabled { background: #9db4e8; cursor: not-allowed; }
  .ghost { background: #eef0f3; color: var(--ink); font-weight: 600; }
  .btnbar { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .status { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .status.work { color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  .hide { display: none; }
  .photo-wrap { display: flex; align-items: center; gap: 12px; }
  .photo-prev { width: 60px; height: 74px; border: 1px solid var(--line); border-radius: 6px; object-fit: cover; background: #f1f3f5; }
  .table-list { margin-top: 10px; }
  .table-list .item { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: #f8fafc; }
  .table-list .item button { padding: 4px 10px; background: #fde2e4; color: var(--danger); font-size: 12px; }
  .badge { display: inline-block; background: var(--accent-weak); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
  .big { font-size: 15px; padding: 13px 22px; }
  #savedList .item { align-items: center; }
  #savedList .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #savedList .meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #savedList .actions { display: flex; gap: 6px; flex-shrink: 0; }
  #savedList .item button { padding: 4px 10px; font-size: 12px; }
  #savedList .item button.dl { background: var(--accent-weak); color: var(--accent); }
  #savedList .item button.load { background: #e7f5ec; color: var(--ok); }
  #savedList .item button.reuse { background: #fff4e5; color: #b26a00; }
  #savedList .item button.del { background: #fde2e4; color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>후보자 프로필 보고서 생성기</h1>
  <p>이름만 입력하면 웹 조사 + LinkedIn(선택)으로 사내 표준 양식의 1장짜리 Word 보고서를 한 번에 만듭니다. 결과는 검토 후 사용하세요.</p>
</header>
<main>

  <!-- format -->
  <div class="card">
    <h2>양식 선택</h2>
    <div class="fmt" id="fmt">
      <label data-fmt="interview" class="sel"><input type="radio" name="format" value="interview" checked />A. 면접용 상세<small>인적사항 표 · 전문역량 · Talking Point</small></label>
      <label data-fmt="basic"><input type="radio" name="format" value="basic" />B. 기본 프로필<small>연령/학력 · 주요경력 · 참고사항</small></label>
      <label data-fmt="summary"><input type="radio" name="format" value="summary" />C. 다수 요약표<small>3~5명 표 1행=1명</small></label>
    </div>
    <div id="summaryOpts" class="hide">
      <label>표 제목 (예: CFO Table, AI Table)</label>
      <input type="text" id="groupLabel" placeholder="Candidate Table" value="Candidate Table" />
    </div>
  </div>

  <!-- inputs -->
  <div class="card">
    <h2>대상 입력</h2>
    <div class="row">
      <div><label>이름</label><input type="text" id="name" placeholder="예: 김삼성 교수" /></div>
      <div><label>소속 (선택)</label><input type="text" id="org" placeholder="예: 삼성전자" /></div>
      <div><label>직급 (선택)</label><input type="text" id="rank" placeholder="예: 상무" /></div>
    </div>
    <div id="categoryWrap" class="hide">
      <label>분류 태그 (요약표용, 예: M&amp;A, 로봇(전략))</label>
      <input type="text" id="category" placeholder="M&A" />
    </div>
    <label>LinkedIn 프로필 URL (선택)</label>
    <input type="url" id="linkedinUrl" placeholder="https://www.linkedin.com/in/..." />
    <label>추가 자료 (뉴스 기사·메모 붙여넣기, 선택)</label>
    <textarea id="sources" rows="5" placeholder="관련 뉴스 기사 본문, 경력/성과 메모 등을 자유롭게 붙여넣으세요."></textarea>
    <label>인물 사진 (선택 · 얼굴 클로즈업 권장 · JPG/PNG)</label>
    <div class="photo-wrap">
      <img id="photoPrev" class="photo-prev" alt="" />
      <div>
        <input type="file" id="photo" accept="image/*" style="display:block; max-width:100%;" />
        <button type="button" class="ghost hide" id="photoClear" style="display:block; margin-top:8px; padding:6px 12px; font-size:12px;">사진 삭제</button>
        <div class="muted" style="margin-top:6px;">양식에 맞는 위치(A·C 성명칸, B 우상단)에 자동 삽입됩니다.</div>
      </div>
    </div>
  </div>

  <!-- output -->
  <div class="card">
    <h2 id="outTitle">보고서 출력</h2>
    <p class="muted" id="outHelp">버튼 하나로 웹 조사 → 초안 작성 → Word 생성까지 진행됩니다. (최대 1~3분 소요)</p>
    <div class="btnbar" id="singleBar">
      <button type="button" class="primary big" id="btnRun">보고서 출력하기</button>
    </div>
    <div class="btnbar hide" id="summaryBar">
      <button type="button" class="ghost" id="btnAdd">인물 조사 후 표에 추가</button>
      <button type="button" class="primary" id="btnRunTable">보고서 출력하기 (표)</button>
    </div>
    <div id="status" class="status"></div>
    <div class="table-list hide" id="tableList"></div>
  </div>

  <!-- saved reports -->
  <div class="card">
    <h2>저장된 보고서 <span class="badge" id="savedCount">0</span></h2>
    <p class="muted" id="savedHelp">생성한 보고서는 서버에 저장되어, 다른 기기·브라우저에서도 다시 다운로드하거나 불러올 수 있습니다.</p>
    <div class="table-list" id="savedList"></div>
    <p class="muted hide" id="savedEmpty">아직 저장된 보고서가 없습니다.</p>
  </div>

</main>

<script>
(function () {
  var IS_MOBILE = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent || "");
  var state = { format: "interview", tableCandidates: [], photoDataUrl: "" };
  function $(id) { return document.getElementById(id); }
  function setStatus(msg, kind) { var el = $("status"); el.textContent = msg || ""; el.className = "status" + (kind ? " " + kind : ""); }

  // ---- Saved reports (Supabase-backed, localStorage fallback) ------------
  var SAVE_KEY = "talenthub.profileReports.v1";
  var FMT_LABEL = { interview: "면접용", basic: "기본", summary: "요약표" };
  var savedLocal = false; // true when the server is unavailable and we fell back

  function apiList() {
    return fetch("/api/profile-reports").then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) throw new Error((d && d.error) || "목록 조회 실패");
      return (d.reports || []).map(function (x) { x.remote = true; return x; });
    });
  }
  function apiGet(id) {
    return fetch("/api/profile-reports?id=" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) throw new Error((d && d.error) || "불러오기 실패");
      return d.report;
    });
  }
  function apiCreate(format, title, data) {
    return fetch("/api/profile-reports", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ format: format, title: title, data: data }) })
      .then(function (r) { return r.json(); }).then(function (d) { if (!d || !d.ok) throw new Error((d && d.error) || "저장 실패"); return d.report; });
  }
  function apiDelete(id) {
    return fetch("/api/profile-reports?id=" + encodeURIComponent(id), { method: "DELETE" }).then(function (r) { return r.json(); })
      .then(function (d) { if (!d || !d.ok) throw new Error((d && d.error) || "삭제 실패"); return true; });
  }

  // localStorage fallback (used only when the server is unreachable)
  function loadLocal() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "[]") || []; } catch (e) { return []; } }
  function persistLocal(list) {
    var arr = list.slice(0, 100);
    while (arr.length) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(arr)); return true; } catch (e) { arr = arr.slice(0, arr.length - 1); } }
    try { localStorage.setItem(SAVE_KEY, "[]"); } catch (e) {}
    return false;
  }

  function saveReport(format, data, title, inputs) {
    title = title || "무제";
    // Keep the original form inputs alongside the report so it can be "reused"
    // (form re-populated) later. The renderer ignores the extra __inputs field.
    var payload = inputs ? Object.assign({}, data, { __inputs: inputs }) : data;
    return apiCreate(format, title, payload)
      .then(function () { return refreshSaved(); })
      .catch(function () {
        savedLocal = true;
        var list = loadLocal();
        list.unshift({ id: String(Date.now()) + Math.random().toString(36).slice(2, 6), ts: Date.now(), format: format, title: title, data: payload });
        persistLocal(list);
        renderSaved(list);
      });
  }

  function refreshSaved() {
    return apiList()
      .then(function (reports) { savedLocal = false; renderSaved(reports); })
      .catch(function () { savedLocal = true; renderSaved(loadLocal()); });
  }

  // Resolve an entry's {format, data} (fetching the blob for remote entries).
  function entryData(entry) {
    if (entry.remote) return apiGet(entry.id).then(function (r) { return { format: r.format, data: r.data }; });
    return Promise.resolve({ format: entry.format, data: entry.data });
  }
  function deleteEntry(entry) {
    if (entry.remote) return apiDelete(entry.id).then(refreshSaved);
    persistLocal(loadLocal().filter(function (x) { return x.id !== entry.id; }));
    renderSaved(loadLocal());
    return Promise.resolve();
  }

  function fmtDate(ts) {
    var d = new Date(ts);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function renderSaved(list) {
    list = list || [];
    $("savedCount").textContent = String(list.length);
    $("savedHelp").textContent = savedLocal
      ? "서버 저장을 사용할 수 없어, 지금은 이 브라우저에만 저장됩니다."
      : "생성한 보고서는 서버에 저장되어, 다른 기기·브라우저에서도 다시 다운로드하거나 불러올 수 있습니다.";
    $("savedEmpty").classList.toggle("hide", list.length > 0);
    $("savedEmpty").textContent = "아직 저장된 보고서가 없습니다.";
    var box = $("savedList"); box.innerHTML = "";
    list.forEach(function (entry) {
      var item = document.createElement("div"); item.className = "item";
      var meta = document.createElement("div"); meta.className = "meta";
      var t = document.createElement("span"); t.className = "t";
      t.innerHTML = '<span class="badge">' + (FMT_LABEL[entry.format] || entry.format) + '</span> ' + escapeHtml(entry.title);
      var sub = document.createElement("span"); sub.className = "muted";
      sub.textContent = fmtDate(entry.ts) + (entry.remote ? "" : " · 로컬");
      meta.appendChild(t); meta.appendChild(sub);
      var actions = document.createElement("div"); actions.className = "actions";
      var dl = document.createElement("button"); dl.className = "dl"; dl.textContent = "다운로드";
      dl.addEventListener("click", function () {
        dl.disabled = true;
        entryData(entry).then(function (e) { return downloadDocx(e.format, e.data); })
          .catch(function (err) { setStatus("실패: " + err.message, "err"); })
          .finally(function () { dl.disabled = false; });
      });
      actions.appendChild(dl);
      if (entry.format === "summary") {
        var load = document.createElement("button"); load.className = "load"; load.textContent = "표 불러오기";
        load.addEventListener("click", function () {
          load.disabled = true;
          entryData(entry).then(function (e) { loadSummaryIntoTable(e.data); })
            .catch(function (err) { setStatus("실패: " + err.message, "err"); })
            .finally(function () { load.disabled = false; });
        });
        actions.appendChild(load);
      } else {
        var reuse = document.createElement("button"); reuse.className = "reuse"; reuse.textContent = "재사용";
        reuse.addEventListener("click", function () {
          reuse.disabled = true;
          entryData(entry).then(function (e) { reuseEntry(e.format, e.data); })
            .catch(function (err) { setStatus("실패: " + err.message, "err"); })
            .finally(function () { reuse.disabled = false; });
        });
        actions.appendChild(reuse);
      }
      var del = document.createElement("button"); del.className = "del"; del.textContent = "삭제";
      del.addEventListener("click", function () { del.disabled = true; deleteEntry(entry).catch(function (err) { setStatus("삭제 실패: " + err.message, "err"); del.disabled = false; }); });
      actions.appendChild(del);
      item.appendChild(meta); item.appendChild(actions); box.appendChild(item);
    });
  }
  function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function setFormat(fmt) {
    var lab = document.querySelector('#fmt label[data-fmt="' + fmt + '"]');
    if (lab) lab.click();
  }
  // Re-populate the input form from a saved report so the user can add more
  // material and generate again. Uses the stored original inputs when present,
  // otherwise falls back to the fields available on the candidate JSON.
  function reuseEntry(format, data) {
    var inp = data.__inputs || {};
    setFormat(inp.format || format || "interview");
    $("name").value = inp.name || data.name || "";
    $("org").value = inp.org || data.orgShort || "";
    $("rank").value = inp.rank || data.role || "";
    $("category").value = inp.category || data.category || "";
    $("linkedinUrl").value = inp.linkedinUrl || "";
    $("sources").value = inp.sourcesText || "";
    var photo = data.photo;
    var b64 = photo && (typeof photo === "string" ? photo : photo.base64 || photo.dataUrl) || "";
    $("photo").value = "";
    setPhoto(b64);
    setStatus("입력값을 불러왔습니다. 참고자료를 추가한 뒤 '보고서 출력하기'로 다시 생성하세요.", "ok");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function loadSummaryIntoTable(data) {
    // Switch to the summary format and restore its candidate list for re-use.
    var lab = document.querySelector('#fmt label[data-fmt="summary"]');
    if (lab) lab.click();
    if (data.groupLabel) $("groupLabel").value = data.groupLabel;
    state.tableCandidates = (data.candidates || []).slice();
    renderTableList();
    setStatus("표를 불러왔습니다 (" + state.tableCandidates.length + "명). 인물을 더 추가하거나 다시 출력하세요.", "ok");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // format switching
  Array.prototype.forEach.call(document.querySelectorAll('#fmt label'), function (lab) {
    lab.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll('#fmt label'), function (l) { l.classList.remove("sel"); });
      lab.classList.add("sel");
      lab.querySelector("input").checked = true;
      state.format = lab.getAttribute("data-fmt");
      var isSummary = state.format === "summary";
      $("summaryOpts").classList.toggle("hide", !isSummary);
      $("categoryWrap").classList.toggle("hide", !isSummary);
      $("singleBar").classList.toggle("hide", isSummary);
      $("summaryBar").classList.toggle("hide", !isSummary);
      $("tableList").classList.toggle("hide", !isSummary);
      setStatus("");
    });
  });

  // photo -> base64
  function setPhoto(dataUrl) {
    state.photoDataUrl = dataUrl || "";
    if (state.photoDataUrl) $("photoPrev").src = state.photoDataUrl;
    else $("photoPrev").removeAttribute("src");
    $("photoClear").classList.toggle("hide", !state.photoDataUrl);
  }
  $("photo").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) { setPhoto(""); return; }
    var reader = new FileReader();
    reader.onload = function () { setPhoto(reader.result); };
    reader.readAsDataURL(f);
  });
  $("photoClear").addEventListener("click", function () {
    $("photo").value = "";
    setPhoto("");
  });

  function inputs() {
    return {
      format: state.format,
      name: $("name").value.trim(),
      org: $("org").value.trim(),
      rank: $("rank").value.trim(),
      category: $("category").value.trim(),
      linkedinUrl: $("linkedinUrl").value.trim(),
      sourcesText: $("sources").value.trim()
    };
  }

  // research one person -> candidate JSON (LinkedIn optional + web research)
  function researchCandidate(inp) {
    var chain = Promise.resolve(null);
    if (inp.linkedinUrl) {
      setStatus("LinkedIn 프로필 조사 중… (최대 2~3분)", "work");
      chain = fetch("/api/linkedin-profile", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: inp.linkedinUrl })
      }).then(function (r) { return r.json(); }).then(function (d) {
        return d.ok && d.profiles && d.profiles[0] ? d.profiles[0] : null;
      }).catch(function () { return null; });
    }
    return chain.then(function (linkedinProfile) {
      setStatus("웹 조사 및 초안 작성 중…", "work");
      return fetch("/api/profile-report", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          format: inp.format, name: inp.name, org: inp.org, rank: inp.rank,
          category: inp.category, linkedinProfile: linkedinProfile, sourcesText: inp.sourcesText
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) throw new Error(d.error || "초안 생성 실패");
        var cand = d.candidate;
        if (state.photoDataUrl) cand.photo = { base64: state.photoDataUrl };
        return cand;
      });
    });
  }

  // download docx for given {format, data}
  function downloadDocx(format, data) {
    setStatus("Word 생성 중…", "work");
    return fetch("/api/profile-report-docx", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ format: format, data: data, variant: "textbox" })
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || ("HTTP " + r.status)); });
      var disp = r.headers.get("Content-Disposition") || "";
      var m = /filename\*=UTF-8''([^;]+)/.exec(disp);
      var fileName = m ? decodeURIComponent(m[1]) : "profile.docx";
      return r.blob().then(function (blob) { return { blob: blob, fileName: fileName }; });
    }).then(function (out) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(out.blob); a.download = out.fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      setStatus("완료: " + out.fileName + " 다운로드됨", "ok");
    });
  }

  // A/B one-click
  $("btnRun").addEventListener("click", function () {
    var inp = inputs();
    if (!inp.name && !inp.linkedinUrl && !inp.sourcesText) { setStatus("이름, LinkedIn URL, 또는 추가 자료 중 하나는 입력하세요.", "err"); return; }
    $("btnRun").disabled = true;
    researchCandidate(inp)
      .then(function (cand) {
        return downloadDocx(inp.format, cand).then(function () {
          var title = (cand.name || inp.name || "무제") + (cand.orgShort ? " (" + cand.orgShort + ")" : "");
          saveReport(inp.format, cand, title, inp);
        });
      })
      .catch(function (e) { setStatus("실패: " + e.message, "err"); })
      .finally(function () { $("btnRun").disabled = false; });
  });

  // C: add person to table
  function renderTableList() {
    var box = $("tableList"); box.innerHTML = "";
    state.tableCandidates.forEach(function (c, i) {
      var div = document.createElement("div"); div.className = "item";
      var span = document.createElement("span");
      span.innerHTML = '<span class="badge">' + (c.category || "-") + '</span> ' + (c.name || "(이름없음)");
      var del = document.createElement("button"); del.textContent = "삭제";
      del.addEventListener("click", function () { state.tableCandidates.splice(i, 1); renderTableList(); });
      div.appendChild(span); div.appendChild(del); box.appendChild(div);
    });
  }
  $("btnAdd").addEventListener("click", function () {
    var inp = inputs();
    if (!inp.name && !inp.linkedinUrl && !inp.sourcesText) { setStatus("이름, LinkedIn URL, 또는 추가 자료 중 하나는 입력하세요.", "err"); return; }
    $("btnAdd").disabled = true;
    researchCandidate(inp).then(function (cand) {
      if (!cand.category && inp.category) cand.category = inp.category;
      state.tableCandidates.push(cand); renderTableList();
      setStatus("추가됨 (현재 " + state.tableCandidates.length + "명). 다음 인물을 입력하거나 표를 출력하세요.", "ok");
    }).catch(function (e) { setStatus("실패: " + e.message, "err"); }).finally(function () { $("btnAdd").disabled = false; });
  });
  $("btnRunTable").addEventListener("click", function () {
    if (!state.tableCandidates.length) { setStatus("표에 인물을 1명 이상 추가하세요.", "err"); return; }
    $("btnRunTable").disabled = true;
    var payload = { groupLabel: $("groupLabel").value.trim() || "Candidate Table", candidates: state.tableCandidates };
    downloadDocx("summary", payload)
      .then(function () { saveReport("summary", payload, payload.groupLabel); })
      .catch(function (e) { setStatus("실패: " + e.message, "err"); })
      .finally(function () { $("btnRunTable").disabled = false; });
  });

  refreshSaved();
})();
</script>
</body>
</html>
